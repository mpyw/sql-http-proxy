# declscope baseline
#
# Violations recorded here are suppressed; new ones are still reported.
# Regenerate with:
#
#     declscope baseline ./...
#
# Do not edit by hand. An entry disappears when its violation is fixed, so the
# diff of a regeneration is the record of what was cleaned up.
packages:
  github.com/mpyw/sql-http-proxy/e2e:
    boundary:
      common:
        - createHandler
        - createMutationHandler
        - decodeJSON
        - loadConfig
        - setupTestDB
  github.com/mpyw/sql-http-proxy/internal/cli/commands:
    qualify:
      app:
        - MaxHeaderBytes
        - MaxHeaderValueCount
        - ReadHeaderTimeout
        - ShutdownTimeout
        - Version
        - action
  github.com/mpyw/sql-http-proxy/internal/config:
    boundary:
      errors:
        - formatValidationError
    qualify:
      config:
        - Parse
        - ParseFile
        - schemaJSON
      errors:
        - arraySources
        - errorWithPath
        - findBothSqlMockError
        - findMissingSqlMockError
        - findMockSourceError
        - findTypeValue
        - formatMockSourceMismatchError
        - formatPath
        - formatValidationError
        - getParentPath
        - isArraySource
        - isMockPath
        - isNumeric
        - isObjectSource
        - isQueryOrMutationPath
        - isSqlMockOneOfError
        - mockPathRe
        - objectSources
        - queryOrMutationPathRe
      types:
        - AcceptForm
        - AcceptJSON
        - AcceptType
        - CSVConfig
        - DatabaseInit
        - EntityMutation
        - EntityQuery
        - EntityType
        - GlobalHelpers
        - Mock
        - Mutation
        - MutationType
        - MutationTypeMany
        - MutationTypeNone
        - MutationTypeOne
        - OpType
        - OpTypeMany
        - OpTypeNone
        - OpTypeOne
        - PostTransform
        - Query
        - QueryType
        - QueryTypeMany
        - QueryTypeOne
        - Transform
  github.com/mpyw/sql-http-proxy/internal/db:
    qualify:
      db:
        - Connect
        - ConnectTimeout
        - executeInit
      statements:
        - BindParams
        - Exec
        - ExecResult
        - QueryMany
        - QueryOne
  github.com/mpyw/sql-http-proxy/internal/executor:
    qualify:
      executor:
        - ErrNotFound
        - ExecContext
        - ExecuteResult
        - Options
        - PhaseError
        - Record
        - Recorder
        - ResultBuilder
        - WrapMockError
        - WrapPostError
        - WrapPreError
