  github.com/mpyw/sql-http-proxy/internal/js:
    boundary:
      error:
        - parseJSError
      pool:
        - runWithTimeout
      transformer:
        - Transformer.helpers
        - Transformer.program
    qualify:
      apply:
        - ErrJSTimeout
        - JSTimeout
        - MockResult
        - NewTransformContext
        - PostTransformResult
        - PreTransformResult
        - TransformContext
        - readBack
        - runCallable
        - setupVM
