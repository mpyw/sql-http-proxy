        - CompileMockJS
        - CompilePost
        - CompilePre
        - compile
  github.com/mpyw/sql-http-proxy/internal/mock:
    boundary:
      csv:
        - parseCSVFileWithOptions
        - parseCSVOptions
        - parseCSVWithOptions
      csvValue:
        - parseValue
      filter:
