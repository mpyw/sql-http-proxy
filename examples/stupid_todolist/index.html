<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stupid Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Stupid Todo List</h1>
    <p class="subtitle">Powered by sql-http-proxy + SQLite</p>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="What needs to be done?" required>
      <button type="submit">Add</button>
    </form>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search todos...">
    </div>

    <div class="filter-buttons">
      <button type="button" class="filter-btn active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="incomplete">Active</button>
      <button type="button" class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <div id="status" class="status"></div>

    <ul id="todo-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
