# Stupid Todo List - sql-http-proxy example
# Uses SQLite in-memory database with auto-initialization

database:
  dsn: "file::memory:?cache=shared"
  init: |
    CREATE TABLE IF NOT EXISTS todos (
      id INTEGER PRIMARY KEY AUTOINCREMENT,
      title TEXT NOT NULL,
      completed INTEGER DEFAULT 0,
      created_at TEXT DEFAULT (datetime('now'))
    );

http:
  cors: true

queries:
  # List all todos
  - type: many
    path: /api/todos
    sql: SELECT id, title, completed, created_at FROM todos ORDER BY created_at DESC
    transform:
      post: |
        return output.map(row => ({
          ...row,
          completed: Boolean(row.completed)
        }));

  # Get single todo
  - type: one
    path: /api/todos/{id:[0-9]+}
    sql: SELECT id, title, completed, created_at FROM todos WHERE id = :id
    transform:
      post: |
        return { ...output, completed: Boolean(output.completed) };

mutations:
  # Create todo
  - type: one
    method: POST
    path: /api/todos
    sql: |
      INSERT INTO todos (title) VALUES (:title)
      RETURNING id, title, completed, created_at
    transform:
      post: |
        response.status = 201;
        return { ...output, completed: Boolean(output.completed) };

  # Update todo
  - type: one
    method: PUT
    path: /api/todos/{id:[0-9]+}
    sql: |
      UPDATE todos SET title = :title, completed = :completed WHERE id = :id
      RETURNING id, title, completed, created_at
    transform:
      pre: |
        return {
          ...input,
          completed: input.completed ? 1 : 0
        };
      post: |
        return { ...output, completed: Boolean(output.completed) };

  # Delete todo
  - type: none
    method: DELETE
    path: /api/todos/{id:[0-9]+}
    sql: DELETE FROM todos WHERE id = :id
    transform:
      post: |
        response.status = 204;
        return null;
