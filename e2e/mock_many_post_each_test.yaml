database:
  dsn: file::memory:?cache=shared

queries:
  - type: many
    path: /users
    mock:
      array_js: |
        return [
          { id: 1, name: "alice" },
          { id: 2, name: "bob" }
        ];
    transform:
      post:
        each: |
          return { ...output, name: output.name.toUpperCase() };
