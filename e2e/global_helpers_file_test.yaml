global_helpers:
  js: |
    function double(n) { return n * 2; }
  js_files:
    - testdata/helpers.js

queries:
  - type: one
    path: /calc
    mock:
      object_js: |
        return {
          doubled: double(parseInt(input.n)),
          tripled: triple(parseInt(input.n)),
          greeting: greet(input.name || "World")
        };
