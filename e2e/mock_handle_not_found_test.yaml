dsn: file::memory:?cache=shared

queries:
  - type: one
    path: /user
    handle_not_found: true
    mock:
      object_js: |
        if (input.id === "999") {
          return null;
        }
        return { id: parseInt(input.id), name: "Mock User" };
    transform:
      post: |
        if (output === null) {
          return { found: false, default: "guest" };
        }
        return { found: true, ...output };
