database:
  dsn: postgres://localhost/test

mutations:
  - type: one
    method: POST
    path: /create
    mock:
      object: { name: "Alice" }
    transform:
      post: |
        return { id: ctx.lastInsertId, name: output.name, hasLastInsertId: ctx.lastInsertId !== undefined, hasRowsAffected: ctx.rowsAffected !== undefined }
