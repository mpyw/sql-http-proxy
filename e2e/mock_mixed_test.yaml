dsn: file::memory:?cache=shared

queries:
  # Real database query
  - type: one
    path: /user
    sql: SELECT * FROM users WHERE id = :id

  # Mock query
  - type: one
    path: /mock/user
    sql: SELECT * FROM users WHERE id = :id
    transform:
      mock: |
        return { id: parseInt(input.id), name: "Mock User", source: "mock" };
