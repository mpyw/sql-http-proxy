dsn: postgres://localhost/test

mutations:
  - type: one
    path: /post-default
    mock:
      object: { default_post: true }

  - type: one
    method: POST
    path: /post-explicit
    mock:
      object: { explicit_post: true }

  - type: one
    method: PUT
    path: /put
    mock:
      object: { success: true }

  - type: one
    method: DELETE
    path: /delete
    mock:
      object: { deleted: true }

  - type: one
    method: PATCH
    path: /patch
    mock:
      object: { patched: true }
