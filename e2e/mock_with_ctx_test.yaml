database:
  dsn: file::memory:?cache=shared

queries:
  - type: one
    path: /user
    mock:
      object_js: |
        ctx.mockTime = Date.now();
        return { id: parseInt(input.id), name: "Mock User" };
    transform:
      pre: |
        ctx.requestedId = input.id;
        return input;
      post: |
        return { ...output, requestedId: ctx.requestedId, hadMockTime: ctx.mockTime !== undefined };
