queries:
  # Object source with delay
  - type: one
    path: /slow-user
    delay: 50ms
    mock:
      object:
        id: 1
        name: Slow User

  # Array source with delay
  - type: many
    path: /slow-users
    delay: 50ms
    mock:
      array:
        - { id: 1, name: Alice }
        - { id: 2, name: Bob }

  # Array source with filter and delay
  - type: one
    path: /slow-filtered-user
    delay: 50ms
    mock:
      array:
        - { id: 1, name: Alice }
        - { id: 2, name: Bob }
      filter: return row.id == parseInt(input.id)

  # JS source with delay
  - type: one
    path: /slow-js-user
    delay: 50ms
    mock:
      object_js: |
        return { id: parseInt(input.id), name: "JS User" };

  # Zero delay (no actual delay)
  - type: one
    path: /no-delay-user
    mock:
      object:
        id: 1
        name: Fast User
