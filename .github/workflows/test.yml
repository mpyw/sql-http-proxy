name: Test

on:
  push: {}
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # id-token: write is what the coverage upload authenticates with, in
    # place of a stored token. A job's permissions replace the workflow's
    # rather than add to them, so contents: read is restated here.
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        go-version: ['1.27']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run unit tests with coverage
        run: go test -v -race -coverprofile=coverage-unit.txt -covermode=atomic -coverpkg=./... ./internal/...

      - name: Run e2e tests with coverage
        run: go test -v -race -coverprofile=coverage-e2e.txt -covermode=atomic -coverpkg=./... ./e2e/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-unit.txt,./coverage-e2e.txt
          use_oidc: true

  declscope:
    name: declscope
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up mise
        uses: jdx/mise-action@v4

      # Before the analyzer: a declaration shrink unexports becomes private to
      # its file's namespace, so a use from another file is then a boundary
      # crossing the analyzer reports.
      - name: Run declscope shrink
        run: declscope shrink ./...

      - name: Run declscope
        run: declscope ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m
